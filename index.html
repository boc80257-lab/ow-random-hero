<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OW 抽英雄</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #1a1a2e; color: #fff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px; user-select: none;
  }
  .title { font-size: 22px; font-weight: bold; color: #f0a500; margin-bottom: 20px; letter-spacing: 2px; }
  
  .mode-selector {
    display: flex; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center;
  }
  .mode-btn {
    background: #16213e; color: #a0a0a0; border: 1px solid #0f3460;
    padding: 10px 18px; border-radius: 20px; font-size: 15px;
    transition: all 0.2s; cursor: pointer;
  }
  .mode-btn.active {
    background: #e94560; color: #fff; border-color: #e94560;
    box-shadow: 0 0 10px rgba(233,69,96,0.5); font-weight: bold;
  }

  .result-box {
    width: 100%; max-width: 360px; height: 200px;
    background: #16213e; border-radius: 16px; border: 1px solid #0f3460;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin-bottom: 30px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .role-type { font-size: 16px; color: #f0a500; margin-bottom: 12px; min-height: 22px; font-weight: bold;}
  .hero-name { font-size: 42px; font-weight: bold; color: #e94560; min-height: 56px; text-align: center; }
  .hero-name.long-text { font-size: 30px; }

  .draw-btn {
    width: 100%; max-width: 360px; padding: 18px 0;
    background: #e94560; color: #fff; border: none; border-radius: 999px;
    font-size: 20px; font-weight: bold; cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    box-shadow: 0 4px 15px rgba(233,69,96,0.4);
  }
  .draw-btn:active { transform: scale(0.96); opacity: 0.85; }
  .draw-btn:disabled { opacity: 0.6; transform: none; box-shadow: none; }
  .hint { margin-top: 20px; font-size: 12px; color: #666; }
</style>
</head>
<body>
  <div class="title">OW 随机抽英雄</div>

  <div class="mode-selector">
    <button class="mode-btn active" data-role="all">随机 (C/奶/T)</button>
    <button class="mode-btn" data-role="dps">输出 (C)</button>
    <button class="mode-btn" data-role="heal">支援 (奶)</button>
    <button class="mode-btn" data-role="tank">重装 (T)</button>
  </div>

  <div class="result-box">
    <div class="role-type" id="roleType">请选择位置</div>
    <div class="hero-name" id="heroName">准备就绪</div>
  </div>

  <button class="draw-btn" id="drawBtn">开始抽取</button>
  <div class="hint">按国服最新版本英雄池</div>

<script>
  // 输出英雄 (C) — 已移除黑影（转为支援）
  const dpsList = [
    '艾什', '堡垒', '卡西迪', '回声', '源氏', '半藏', '狂鼠', '美',
    '法老之鹰', '死神', '士兵:76', '秩序之光', '托比昂', '猎空',
    '黑百合', '索杰恩', '芙蕾雅', '安燃', '斩仇', '探奇', '埃姆雷',
    '希拉', '死怨'
  ];

  // 重装英雄 (T)
  const tankList = [
    'D.Va', '末日铁拳', '毛加', '渣客女王', '奥丽莎', '拉玛刹',
    '莱因哈特', '路霸', '西格玛', '温斯顿', '破坏球', '查莉娅', '骇灾'
  ];

  // 支援英雄 (奶) — 已加入血律、黑影（重做后）
  const healList = [
    '安娜', '巴蒂斯特', '布丽吉塔', '伊拉锐', '朱诺', '雾子',
    '生命之梭', '卢西奥', '天使', '莫伊拉', '禅雅塔', '无漾',
    '血律', '黑影'
  ];

  const modeBtns = document.querySelectorAll('.mode-btn');
  const roleEl = document.getElementById('roleType');
  const heroEl = document.getElementById('heroName');
  const drawBtn = document.getElementById('drawBtn');

  let currentMode = 'all';
  let drawing = false;

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      modeBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.getAttribute('data-role');
      if (!drawing) {
        heroEl.textContent = '准备就绪';
        heroEl.classList.remove('long-text');
        if (currentMode === 'dps') roleEl.textContent = '已选择：输出 (C)';
        else if (currentMode === 'heal') roleEl.textContent = '已选择：支援 (奶)';
        else if (currentMode === 'tank') roleEl.textContent = '已选择：重装 (T)';
        else roleEl.textContent = '已选择：全位置随机';
      }
    });
  });

  drawBtn.addEventListener('click', () => {
    if (drawing) return;
    drawing = true;
    drawBtn.disabled = true;
    heroEl.textContent = '...';
    heroEl.classList.remove('long-text');
    roleEl.textContent = '正在计算...';

    setTimeout(() => {
      let pool = [], typeLabel = '';

      if (currentMode === 'all') {
        const rand = Math.random();
        if (rand < 0.34) { pool = dpsList; typeLabel = '输出 (C)'; }
        else if (rand < 0.67) { pool = tankList; typeLabel = '重装 (T)'; }
        else { pool = healList; typeLabel = '支援 (奶)'; }
      } else if (currentMode === 'dps') { pool = dpsList; typeLabel = '输出 (C)'; }
      else if (currentMode === 'tank') { pool = tankList; typeLabel = '重装 (T)'; }
      else { pool = healList; typeLabel = '支援 (奶)'; }

      const hero = pool[Math.floor(Math.random() * pool.length)];
      roleEl.textContent = typeLabel;
      heroEl.textContent = hero;

      if (hero.length > 4) heroEl.classList.add('long-text');
      if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

      drawing = false;
      drawBtn.disabled = false;
    }, 400);
  });
</script>
</body>
</html>
